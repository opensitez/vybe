[package]
name = "osbrowser"
version = "0.5.0"
edition = "2024"
description = "webcore's API, driving the system browser: the same Document, window, events and canvas, rendered by Chrome, Firefox or Safari"
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/opensitez/osbrowser"
readme = "README.md"
keywords = ["html", "dom", "browser", "gui", "canvas"]
categories = ["gui", "web-programming"]
include = ["src/**", "examples/**", "tests/**", "README.md", "LICENSE-GPL", "Cargo.toml"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1.10", features = ["v4"] }
# The canvas API is webcanvas's, exactly as webcore re-exports it.
webcanvas = "0.2.0"
tiny-skia = "0.12"
base64 = "0.21"
rfd = "0.15.4"
