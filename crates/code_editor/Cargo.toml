[package]
name = "code_editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Core crates for the pure-Rust prototype. Pin versions as needed.
tiny-skia = "0.12.0"
winit = "0.30"
ropey = "1.6.1"
arboard = { version = "3.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = "0.97.0"
lsp-server = "0.7.9"
crossbeam-channel = "0.5.15"
vybe_compiler = { path = "../vybe_compiler" }
fuzzy-matcher = "0.3.7"
vybe_widgets = { path = "../vybe_widgets" }
uuid = { version = "1", features = ["v4"] }
rfd = { workspace = true }
