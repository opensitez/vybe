[package]
name = "code_editor"
version = "0.1.0"
edition = "2021"
authors = ["you"]

[dependencies]
# Core crates for the pure-Rust prototype. Pin versions as needed.
cosmic-text = "0.18.2"
tiny-skia = "0.12.0"
minifb = "0.28"
winit = "0.30"
softbuffer = "0.4"
ropey = "1.6.1"
unicode-segmentation = "1.13.2"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = "0.97.0"
lsp-server = "0.7.9"
crossbeam-channel = "0.5.15"
url = "2.5"
vybe_parser_basic = { path = "../vybe_parser_basic" }
vybe_parser_js = { path = "../vybe_parser_js" }
vybe_parser_csharp = { path = "../vybe_parser_csharp" }
pest = "2.8"
fuzzy-matcher = "0.3.7"
vybe_widgets = { path = "../vybe_widgets" }
vybe_forms = { path = "../vybe_forms" }
vybe_project = { path = "../vybe_project" }
uuid = { version = "1", features = ["v4"] }
rfd = "0.14"
