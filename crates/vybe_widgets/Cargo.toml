[package]
name = "vybe_widgets"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny-skia = "0.12.0"
cosmic-text = "0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ropey = "1.6.1"
winit = "0.30"
arboard = { version = "3.4", default-features = false }
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = { workspace = true }
