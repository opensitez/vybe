[package]
name = "vybe_widgets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tiny-skia = "0.12.0"
cosmic-text = "0.18.2"
# Glyph OUTLINES, for canvas `strokeText`. Already in the tree as cosmic-text's
# own dependency at this exact version — naming it here does not add a crate, it
# makes the outline API reachable. cosmic-text re-exports the rasteriser
# (`SwashCache`) but not `scale::ScaleContext`, and a filled glyph is not a
# stroked one.
swash = "0.2"
# Canvas `toDataURL`. Already in the tree; a page's only route to its own canvas
# pixels is a data URL, because it cannot be handed a file path.
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ropey = "1.6.1"
winit = "0.30"
arboard = { version = "3.4", default-features = false }
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = { workspace = true }
