[package]
name = "testrunner"
version = "0.1.0"
edition = "2024"

# A workspace member with ZERO Vybe dependencies. The zero deps — not the
# membership — are what keep it out of the 20-crate relink: it drives the
# already-built `vybex` binary as a subprocess, so cargo has no reason to
# rebuild it when the compiler changes. (`testecma` links vybe_compiler and
# vybe_runtime directly, which is exactly why it rebuilds with everything.)

[dependencies]
anyhow = "1"
chrono = "0.4"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
walkdir = "2"

[[bin]]
name = "testrunner"
path = "src/main.rs"
