[package]
name = "vybex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
vybe_language_c = { workspace = true }
vybe_language_cobol = { workspace = true }
vybe_language_csharp = { workspace = true }
vybe_language_dart = { workspace = true }
vybe_language_fortran = { workspace = true }
vybe_language_go = { workspace = true }
vybe_language_java = { workspace = true }
vybe_language_js = { workspace = true }
vybe_language_lua = { workspace = true }
vybe_language_pascal = { workspace = true }
vybe_language_php = { workspace = true }
vybe_language_python = { workspace = true }
vybe_language_ruby = { workspace = true }
vybe_language_vb = { workspace = true }
vybe_language_wast = { workspace = true }
vybe_language_kotlin = { workspace = true }
vybe_language_powershell = { workspace = true }
vybe_language_washm = { workspace = true }
vybe_compiler = { workspace = true }
vybe_runtime = { workspace = true }
vybe_platform_wasm = { workspace = true }
vybe_platform_dotnet = { workspace = true }
vybe_platform_flutter = { workspace = true }
vybe_platform_libc = { workspace = true }
vybe_platform_plib = { workspace = true }
vybe_platform_ecma = { workspace = true }
# `gui` installs `widgets` as the DOM behind `web:html`.
# BOTH engines, so `VYBE_ENGINE=webcore` is a restart and not a rebuild.
# `engine-webcore` implies `gui`, so this is additive: widgets is still the
# default, and `engine_select` picks between them at startup.
vybe_platform_web = { workspace = true, features = ["engine-webcore"] }
vybe_platform_wasi = { workspace = true }
vybe_platform_node = { workspace = true }
widgets = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
percent-encoding = { workspace = true }
form_urlencoded = { workspace = true }
indexmap = { workspace = true }
mime_guess = { workspace = true }
dashmap = { workspace = true }
serde_json = { workspace = true }
