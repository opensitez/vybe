[package]
name = "vybe_platform_node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
inventory = { workspace = true }
vybe_runtime = { workspace = true }
vybe_platform_wasi = { workspace = true } # node:crypto reuses wasi:crypto md5/sha256

# Node.js compat support crates (moved from vybe_host).
# Digests come from vybe_platform_wasi::crypto — node:crypto only maps
# OpenSSL names onto them. sha2/hmac stay for the non-digest paths.
sha2 = { workspace = true }
hmac = { workspace = true }
brotli = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
percent-encoding = { workspace = true }
httpdate = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
url = { workspace = true }

[dev-dependencies]
vybe_compiler = { workspace = true }
