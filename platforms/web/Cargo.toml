[package]
name = "vybe_platform_web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
inventory = { workspace = true }
vybe_runtime = { workspace = true }
vybe_platform_ecma = { workspace = true }
osbrowser = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The engine behind `web:canvas` / `web:dom`. The web platform binds it
# DIRECTLY — no adapter crate in between, no second surface to keep in sync.
# The OTHER engine behind the same seam. `engine.rs` names neither, so both can
# be compiled in at once and the choice is which one calls `set_engine`.
webcore = { workspace = true, optional = true }
tiny-skia = "0.12"

# WHATWG / W3C web-platform support crates (moved from vybe_host).
sha2 = { workspace = true }
md-5 = { workspace = true }
url = { workspace = true }
quick-xml = { workspace = true }
form_urlencoded = { workspace = true }

[features]
default = ["engine-webcore"]
engine-webcore = ["webcore"]
engine-osbrowser = ["osbrowser", "rfd"]
