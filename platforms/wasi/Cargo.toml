[package]
name = "vybe_platform_wasi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
inventory = { workspace = true }
vybe_runtime = { workspace = true }

# WASI 0.2.x support crates (moved from vybe_host, incl. the sockets module).
rusqlite = { workspace = true }
postgres = { workspace = true }
mysql = { workspace = true }
# Digest primitives — the single implementation every interface skin
# (node:crypto, wasi:crypto, PHP hash(), ...) composes.
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
sha3 = { workspace = true }
blake2 = { workspace = true }
ripemd = { workspace = true }
getrandom = { workspace = true }
socket2 = { workspace = true }
# `udp-socket.disconnect` is a `connect(2)` to an AF_UNSPEC address — the only
# way POSIX dissolves a datagram association, and neither `std::net` nor
# `socket2` can express it. Already in the lockfile.
libc = { workspace = true }

[dev-dependencies]
vybe_compiler = { workspace = true }
