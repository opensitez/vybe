[package]
name = "vybe_language_lua"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "vybe_language_lua"

[features]
# Compatibility flag: Grameo is always the parser.
native-parser = []

[dependencies]
grameo = { path = "../../crates/grameo" }
vybe_compiler = { workspace = true }
inventory = { workspace = true }
vybe_ast = { workspace = true }
vybe_runtime = { workspace = true }

[build-dependencies]
grameo_codegen = { path = "../../crates/grameo/codegen" }

[dev-dependencies]
vybe_compiler = { workspace = true }
vybe_runtime = { workspace = true }
vybe_ast = { workspace = true }
