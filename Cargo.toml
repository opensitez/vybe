[workspace]
resolver = "2"
members = [
    "crates/code_editor",
    "crates/vybe_runtime",
    "crates/vybe_widgets",
    "crates/vybe_compiler",
    "crates/vybex",
    "crates/testrunner",
    "crates/vybe_ast",
    "languages/java",
    "languages/cobol",
    "languages/csharp",
    "languages/php",
    "languages/js",
    "languages/vb",
    "languages/c",
    "languages/pascal",
    "languages/fortran",
    "languages/dart",
    "languages/ruby",
    "languages/python",
    "languages/wast",
    "languages/lua",
    "languages/go",
    "languages/kotlin",
    "languages/powershell",
    "platforms/dotnet",
    "platforms/ecma",
    "platforms/flutter",
    "platforms/jvm",
    "platforms/libc",
    "platforms/plib",
    "platforms/wasm",
    "platforms/web",
    "platforms/wasi",
    "platforms/node",
    "ecma/testecma",
    "crates/testrunner",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Opensitez Vybe Team"]
license = "GPLv3"

[workspace.dependencies]
native-tls = "0.2"
# Parser dependencies
pest = "2.7"
pest_derive = "2.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.10", features = ["serde", "v4"] }
thiserror = "1.0"
regex = "1"
regress = "0.11.1"
# sqlx retired — replaced by wasi:sql (crate::wasi::sql) using native sync drivers.
# tokio kept for the HTTP server stack (hyper, wasi:http, node:http).
tokio = { version = "1", features = ["full"] }
# Native SQL drivers — no async overhead, no proc-macro machinery.
rusqlite = { version = "0.31", features = ["bundled"] }   # SQLite: bundles libsqlite3, no system dep
postgres = "0.19"                                           # PostgreSQL: sync wrapper (pure Rust)
mysql = "25"                                                # MySQL: sync, pure Rust
chrono = "0.4"
indexmap = "2"
# Link-time plugin collection: every plugin crate submits itself, and the one
# registration loop iterates whatever is linked. No plugin list in code.
inventory = "0.3"
dashmap = "6"

# Dialog libraries
rfd = "0.14"

# HTTP server stack
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
percent-encoding = "2"
form_urlencoded = "1"
url = "2"
mime_guess = "2"
httpdate = "1"

# Cryptographic hashes — RustCrypto family. Replaces hand-rolled
# SHA-256 / MD5 in `vybe_host::modules::crypto`.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
# The rest of `crypto.getHashes()`. Node delegates to OpenSSL, which offers
# all of these; without them `createHash` silently fell back to SHA-256.
# All on `digest` 0.10, matching sha2/sha1/md-5 and `hmac` 0.12.
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"   # 0.2 moves to digest 0.11; stay on 0.10 with the rest
# OS entropy for `wasi:random/random`, which the spec requires to be
# CSPRNG-grade and non-blocking. Portable across Unix + Windows, matching the
# proposal's "portable at least between Unix-family platforms and Windows".
getrandom = "0.2"
# Socket options WASI 0.3 `wasi:sockets/types` requires and `std::net` has no
# API for: keep-alive, send/receive buffer sizes, and binding a socket before
# deciding whether it listens or connects. Already in the lockfile via tokio.
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

# WHATWG DOM Parsing & Serialization backing — pull-based XML parser.
# `web:dom-parser` (the `DOMParser` / `XMLSerializer` host module)
# uses this to materialise spec-compliant Document trees.
quick-xml = "0.36"

# Compression — backs node:zlib host module.
flate2 = "1"
brotli = "7"

# Internal crates
vybe_runtime = { path = "crates/vybe_runtime" }
vybe_ast = { path = "crates/vybe_ast" }
vybe_plugin = { path = "crates/vybe_plugin" }
vybe_language_java = { path = "languages/java" }
vybe_language_cobol = { path = "languages/cobol" }
vybe_language_csharp = { path = "languages/csharp" }
vybe_language_php = { path = "languages/php" }
vybe_language_js = { path = "languages/js" }
vybe_language_vb = { path = "languages/vb" }
vybe_language_c = { path = "languages/c" }
vybe_language_pascal = { path = "languages/pascal" }
vybe_language_fortran = { path = "languages/fortran" }
vybe_language_dart = { path = "languages/dart" }
vybe_language_ruby = { path = "languages/ruby" }
vybe_language_python = { path = "languages/python" }
vybe_language_wast = { path = "languages/wast" }
vybe_language_lua = { path = "languages/lua" }
vybe_language_go = { path = "languages/go" }
vybe_language_kotlin = { path = "languages/kotlin" }
vybe_language_powershell = { path = "languages/powershell" }
vybe_platform_wasm = { path = "platforms/wasm" }
vybe_platform_ecma = { path = "platforms/ecma" }
vybe_platform_web = { path = "platforms/web" }
vybe_platform_wasi = { path = "platforms/wasi" }
vybe_platform_node = { path = "platforms/node" }
vybe_platform_libc = { path = "platforms/libc" }
vybe_platform_dotnet = { path = "platforms/dotnet" }
vybe_platform_flutter = { path = "platforms/flutter" }
vybe_platform_jvm = { path = "platforms/jvm" }
vybe_platform_plib = { path = "platforms/plib" }
vybe_widgets = { path = "crates/vybe_widgets" }
# The HTML/CSS engine behind `web:*` when the `engine-webcore` feature is on.
webcore = "0.2.0"
vybe_compiler = { path = "crates/vybe_compiler" }
vybex = { path = "crates/vybex" }
