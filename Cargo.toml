[workspace]
resolver = "2"
members = [
    "crates/code_editor",
    "crates/vybe_bytecode",
    "crates/vybe_host",
    "crates/vybe_widgets",
    "crates/vybe_compiler",
    "crates/vybex",
    "crates/vybe_ast",
    "crates/vybe_plugin",
    "languages/java",
    "languages/cobol",
    "languages/csharp",
    "languages/php",
    "languages/js",
    "languages/vb",
    "languages/c",
    "languages/pascal",
    "languages/fortran",
    "languages/dart",
    "languages/ruby",
    "languages/python",
    "languages/wast",
    "languages/lua",
    "languages/go",
    "crates/vybe_emitter",
    "platforms/dotnet",
    "platforms/libc",
    "platforms/plib",
    "platforms/wasm",
    "ecma/testecma",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Opensitez Vybe Team"]
license = "GPLv3"

[workspace.dependencies]
# Parser dependencies
pest = "2.7"
pest_derive = "2.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.10", features = ["serde", "v4"] }
thiserror = "1.0"
regex = "1"
regress = "0.11.1"
# sqlx retired — replaced by wasi:sql (crate::wasi::sql) using native sync drivers.
# tokio kept for the HTTP server stack (hyper, wasi:http, node:http).
tokio = { version = "1", features = ["full"] }
# Native SQL drivers — no async overhead, no proc-macro machinery.
rusqlite = { version = "0.31", features = ["bundled"] }   # SQLite: bundles libsqlite3, no system dep
postgres = "0.19"                                           # PostgreSQL: sync wrapper (pure Rust)
mysql = "25"                                                # MySQL: sync, pure Rust
chrono = "0.4"
indexmap = "2"
dashmap = "6"

# Dialog libraries
rfd = "0.14"

# HTTP server stack
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
percent-encoding = "2"
form_urlencoded = "1"
url = "2"
mime_guess = "2"
httpdate = "1"

# Cryptographic hashes — RustCrypto family. Replaces hand-rolled
# SHA-256 / MD5 in `vybe_host::modules::crypto`.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"

# WHATWG DOM Parsing & Serialization backing — pull-based XML parser.
# `web:dom-parser` (the `DOMParser` / `XMLSerializer` host module)
# uses this to materialise spec-compliant Document trees.
quick-xml = "0.36"

# Compression — backs node:zlib host module.
flate2 = "1"
brotli = "7"

# Internal crates
vybe_bytecode = { path = "crates/vybe_bytecode" }
vybe_ast = { path = "crates/vybe_ast" }
vybe_plugin = { path = "crates/vybe_plugin" }
vybe_language_java = { path = "languages/java" }
vybe_language_cobol = { path = "languages/cobol" }
vybe_language_csharp = { path = "languages/csharp" }
vybe_language_php = { path = "languages/php" }
vybe_language_js = { path = "languages/js" }
vybe_language_vb = { path = "languages/vb" }
vybe_language_c = { path = "languages/c" }
vybe_language_pascal = { path = "languages/pascal" }
vybe_language_fortran = { path = "languages/fortran" }
vybe_language_dart = { path = "languages/dart" }
vybe_language_ruby = { path = "languages/ruby" }
vybe_language_python = { path = "languages/python" }
vybe_language_wast = { path = "languages/wast" }
vybe_language_lua = { path = "languages/lua" }
vybe_language_go = { path = "languages/go" }
vybe_emitter = { path = "crates/vybe_emitter" }
vybe_platform_wasm = { path = "platforms/wasm" }
vybe_platform_libc = { path = "platforms/libc" }
vybe_platform_dotnet = { path = "platforms/dotnet" }
vybe_platform_plib = { path = "platforms/plib" }
vybe_host = { path = "crates/vybe_host" }
vybe_widgets = { path = "crates/vybe_widgets" }
vybe_compiler = { path = "crates/vybe_compiler" }
vybex = { path = "crates/vybex" }
