[workspace]
resolver = "2"
members = [
    "crates/code_editor",
    "crates/vybe_bytecode",
    "crates/vybe_host",
    "crates/vybe_widgets",
    "crates/vybe_compiler",
    "crates/vybex",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Opensitez Vybe Team"]
license = "GPLv3"

[workspace.dependencies]
# Parser dependencies
pest = "2.7"
pest_derive = "2.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.10", features = ["serde", "v4"] }
thiserror = "1.0"
regex = "1"
regress = "0.11.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "any"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
indexmap = "2"
dashmap = "6"

# Dialog libraries
rfd = "0.14"

# HTTP server stack
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
percent-encoding = "2"
form_urlencoded = "1"
mime_guess = "2"
httpdate = "1"

# Cryptographic hashes — RustCrypto family. Replaces hand-rolled
# SHA-256 / MD5 in `vybe_host::modules::crypto`.
sha2 = "0.10"
md-5 = "0.10"

# WHATWG DOM Parsing & Serialization backing — pull-based XML parser.
# `web:dom-parser` (the `DOMParser` / `XMLSerializer` host module)
# uses this to materialise spec-compliant Document trees.
quick-xml = "0.36"

# Internal crates
vybe_bytecode = { path = "crates/vybe_bytecode" }
vybe_host = { path = "crates/vybe_host" }
vybe_widgets = { path = "crates/vybe_widgets" }
vybe_compiler = { path = "crates/vybe_compiler" }
vybex = { path = "crates/vybex" }
